<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticker Overlay</title>
    <link rel="icon" href="/assets/eyes/scalable-eyes.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div class="ticker" id="ticker-root" role="marquee" aria-live="polite">
        <div class="ticker__edge ticker__edge--left" aria-hidden="true"></div>
        <div class="ticker__center">
          <div class="ticker__brand">
            <div class="ticker__brand-inner">
              <span class="ticker__brand-label">SuhhhCuh</span>
              <img
                class="ticker__eyes"
                src="/assets/eyes/scalable-eyes.png"
                alt=""
                width="118"
                height="41"
              />
            </div>
          </div>
          <div class="ticker__viewport">
            <div class="ticker__stage" id="ticker-stage" aria-live="polite"></div>
            <div class="ticker__alert-layer" id="ticker-alert-layer" hidden></div>
          </div>
        </div>
        <div class="ticker__edge ticker__edge--right" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
